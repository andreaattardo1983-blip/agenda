<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OmniDesk Cloud — Tutto-in-Uno Widget Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .bento-card {
      background: linear-gradient(145deg, rgba(23, 30, 48, 0.92), rgba(15, 20, 34, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .bento-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 9999px; }
    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording-pulse { animation: pulseRing 1.5s infinite; }
    @media print {
      body {
        background: #ffffff !important;
        color: #0f172a !important;
      }
      body.printing-day-agenda > *:not(#dayPrintArea) {
        display: none !important;
      }
      #dayPrintArea {
        display: block !important;
        padding: 20px;
        color: #0f172a;
        background: #ffffff;
      }
    }
    #dayPrintArea {
      display: none;
    }

  </style>
</head>
