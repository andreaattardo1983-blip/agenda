<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniDesk — Agenda, Vault & Cloud Sync</title>
  <style>
    :root {
      --bg-main: #070b14;
      --bg-card: #0e1626;
      --bg-card-soft: #131e33;
      --bg-input: #0a101d;
      --border: #1e2d4a;
      --border-soft: #172238;
      --text-main: #eef3ff;
      --text-muted: #8a9bb8;
      --accent: #5b5cff;
      --accent-hover: #494af5;
      --accent-soft: rgba(91, 92, 255, 0.16);
      --ok: #10b981;
      --ok-soft: rgba(16, 185, 129, 0.14);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --pink: #e11d48;
      --radius: 14px;
      --radius-sm: 9px;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 18px;
      background: radial-gradient(circle at top left, #111b33 0%, var(--bg-main) 55%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 8px;
      flex-shrink: 0;
    }

    .brand-logo span {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 2px;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .cloud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: var(--ok-soft);
      color: #34d399;
      cursor: pointer;
    }

    .cloud-pill.offline {
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--warn-soft);
      color: #fbbf24;
    }

    .cloud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      width: 210px;
    }

    button {
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 13px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      background: var(--bg-card-soft);
      border: 1px solid var(--border);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #1a2844;
      border-color: #2d426c;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button.btn-danger {
      background: var(--danger-soft);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    button.btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.28);
    }

    button.active-filter {
      background: var(--warn);
      border-color: var(--warn);
      color: #090d16;
    }

    button.active-time-filter {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.active-folder {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .icon-btn {
      padding: 8px 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .bento-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 700;
    }

    .count-badge {
      background: var(--accent-soft);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    @media (max-width: 980px) {
      .quick-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 520px) {
      .quick-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .quick-tile {
      border-radius: 11px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .tile-impegno { background: linear-gradient(160deg, #1b2350, #121735); }
    .tile-scadenza { background: linear-gradient(160deg, #3a2716, #241910); }
    .tile-nota { background: linear-gradient(160deg, #2d2b14, #1b1a0e); }
    .tile-vocale { background: linear-gradient(160deg, #3b172a, #240e1a); }
    .tile-file { background: linear-gradient(160deg, #132944, #0d1a2c); }
    .tile-password { background: linear-gradient(160deg, #11322c, #0b1f1c); }

    .quick-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 640px) {
      .quick-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }

    .quick-bar input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
    }

    .main-bento {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .main-bento {
        grid-template-columns: 1fr;
      }
    }

    .left-stack,
    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-buttons button {
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    .ref-date-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .ref-date-wrap input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 0.78rem;
    }

    .inline-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
    }

    .inline-form.hidden {
      display: none;
    }

    .inline-form input,
    .inline-form select,
    .inline-form textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 0.83rem;
    }

    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row-item {
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: 11px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .row-item.selected {
      border-color: var(--accent);
      background: rgba(91, 92, 255, 0.08);
    }

    .row-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-main {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.9rem;
      font-weight: 600;
      word-break: break-word;
    }

    .item-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 3px;
      word-break: break-word;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .pill-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-card-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .pill-tag.ok {
      background: var(--ok-soft);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .pill-tag.file {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }

    .pill-tag.pdf {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .pill-tag.foto {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.35);
      color: #6
