<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stampa Foto e PDF</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      padding: 16px;
      background: #fafbfd;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    input[type="file"],
    input[type="url"] {
      width: 100%;
      padding: 8px;
      margin: 10px 0 12px;
      border: 1px solid #ccd2dc;
      border-radius: 6px;
      background: #fff;
    }

    button {
      background-color: #1d63ed;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
    }

    button:hover:not(:disabled) {
      background-color: #154ec0;
    }

    button:disabled {
      background-color: #a9bce6;
      cursor: not-allowed;
    }

    .preview-box {
      border: 1px dashed #cbd2d9;
      border-radius: 8px;
      padding: 16px;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      overflow: hidden;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: none;
    }

    .preview-box iframe {
      width: 100%;
      height: 520px;
      border: none;
      display: none;
    }

    .placeholder {
      color: #6c757d;
      text-align: center;
    }

    .messaggio {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #b42318;
      min-height: 20px;
    }

    /* Stili dedicati alla stampa */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      .container > h1,
      .grid,
      .messaggio,
      .placeholder {
        display: none !important;
      }

      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }

      .preview-box {
        border: none;
        padding: 0;
        min-height: auto;
      }

      .preview-box img {
        max-width: 100%;
        max-height: 100vh;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stampa Foto e PDF</h1>

    <div class="grid">
      <!-- 1. Foto da file locale -->
      <div class="card">
        <h2>1. Foto dal dispositivo</h2>
        <input type="file" id="inputFoto" accept="image/*">
        <button id="btnStampaFoto" disabled>Stampa Foto</button>
      </div>

      <!-- 2. PDF da file locale -->
      <div class="card">
        <h2>2. PDF dal dispositivo</h2>
        <input type="file" id="inputPdf" accept="application/pdf">
        <button id="btnStampaPdfLocale" disabled>Stampa PDF</button>
      </div>

      <!-- 3. File tramite URL -->
      <div class="card">
        <h2>3. Foto o PDF da URL</h2>
        <input type="url" id="inputUrl" placeholder="https://esempio.it/file.pdf">
        <button id="btnStampaUrl">Carica e Stampa URL</button>
      </div>
    </div>

    <div class="preview-box" id="previewBox">
      <div class="placeholder" id="placeholder">
        Seleziona una foto, un PDF o inserisci un URL per visualizzare l'anteprima e stampare.
      </div>
      <img id="anteprimaFoto" alt="Anteprima foto">
      <iframe id="anteprimaPdf" title="Anteprima PDF"></iframe>
    </div>

    <div class="messaggio" id="messaggio"></div>
  </div>

  <script>
    const inputFoto = document.getElementById('inputFoto');
    const inputPdf = document.getElementById('inputPdf');
    const inputUrl = document.getElementById('inputUrl');

    const btnStampaFoto = document.getElementById('btnStampaFoto');
    const btnStampaPdfLocale = document.getElementById('btnStampaPdfLocale');
    const btnStampaUrl = document.getElementById('btnStampaUrl');

    const anteprimaFoto = document.getElementById('anteprimaFoto');
    const anteprimaPdf = document.getElementById('anteprimaPdf');
    const placeholder = document.getElementById('placeholder');
    const messaggio = document.getElementById('messaggio');

    let urlOggettoCorrente = null;
    let urlPdfCorrente = null;

    function mostraMessaggio(testo) {
      messaggio.textContent = testo;
    }

    function resetAnteprima() {
      mostraMessaggio('');
      placeholder.style.display = 'none';
      anteprimaFoto.style.display = 'none';
      anteprimaPdf.style.display = 'none';
      btnStampaFoto.disabled = true;
      btnStampaPdfLocale.disabled = true;

      if (urlOggettoCorrente) {
        URL.revokeObjectURL(urlOggettoCorrente);
        urlOggettoCorrente = null;
      }
    }

    // Carica foto locale
    inputFoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetAnteprima();
      urlOggettoCorrente = URL.createObjectURL(file);
      anteprimaFoto.src = urlOggettoCorrente;
      anteprimaFoto.style.display = 'block';
      btnStampaFoto.disabled = false;
      inputPdf.value = '';
    });

    // Stampa foto caricata
    btnStampaFoto.addEventListener('click', () => {
      if (!anteprimaFoto.src) return;

      const finestra = window.open('', '_blank', 'width=800,height=600');
      if (!finestra) {
        mostraMessaggio('Consenti i popup nel browser per avviare la stampa.');
        return;
      }

      finestra.document.write(`
        <!DOCTYPE html>
        <html lang="it">
        <head>
          <meta charset="UTF-8">
          <title>Stampa Foto</title>
          <style>
            @page { margin: 10mm; }
            body {
              margin: 0;
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
            }
            img {
              max-width: 100%;
              max-height: 95vh;
              object-fit: contain;
            }
          </style>
        </head>
        <body>
          <img id="imgStampa" src="${anteprimaFoto.src}" alt="Foto da stampare">
          <script>
            const img = document.getElementById('imgStampa');
            img.onload = () => {
              window.focus();
              window.print();
              window.close();
            };
          <\/script>
        </body>
        </html>
      `);
      finestra.document.close();
    });

    // Carica PDF locale
    inputPdf.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetAnteprima();
      urlOggettoCorrente = URL.createObjectURL(file);
      urlPdfCorrente = urlOggettoCorrente;
      anteprimaPdf.src = urlOggettoCorrente;
      anteprimaPdf.style.display = 'block';
      btnStampaPdfLocale.disabled = false;
      inputFoto.value = '';
    });

    // Stampa PDF locale
    btnStampaPdfLocale.addEventListener('click', () => {
      if (!urlPdfCorrente) return;
      stampaPdfDaUrl(urlPdfCorrente);
    });

    // Carica e stampa da URL (foto o PDF)
    btnStampaUrl.addEventListener('click', () => {
      const url = inputUrl.value.trim();
      if (!url) {
        mostraMessaggio('Inserisci un URL valido.');
        return;
      }

      resetAnteprima();
      const ePdf = url.toLowerCase().includes('.pdf');

      if (ePdf) {
        urlPdfCorrente = url;
        anteprimaPdf.src = url;
        anteprimaPdf.style.display = 'block';
        stampaPdfDaUrl(url);
      } else {
        anteprimaFoto.onload = () => {
          btnStampaFoto.disabled = false;
          btnStampaFoto.click();
        };
        anteprimaFoto.onerror = () => {
          placeholder.style.display = 'block';
          mostraMessaggio('Impossibile caricare la foto dall’URL indicato.');
        };
        anteprimaFoto.src = url;
        anteprimaFoto.style.display = 'block';
      }
    });

    function stampaPdfDaUrl(url) {
      const iframeStampa = document.createElement('iframe');
      iframeStampa.style.position = 'fixed';
      iframeStampa.style.right = '0';
      iframeStampa.style.bottom = '0';
      iframeStampa.style.width = '0';
      iframeStampa.style.height = '0';
      iframeStampa.style.border = '0';
      iframeStampa.src = url;

      iframeStampa.onload = () => {
        try {
          iframeStampa.contentWindow.focus();
          iframeStampa.contentWindow.print();
        } catch (err) {
          // Se il browser blocca la stampa diretta su PDF esterni (CORS), apre in una nuova scheda
          window.open(url, '_blank');
        }
      };

      document.body.appendChild(iframeStampa);
    }
  </script>
</body>
</html>
