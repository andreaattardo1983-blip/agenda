<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Promemoria & Stampa Foto/PDF</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.65rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    .sezione {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e5e9f0;
    }

    .sezione:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    /* Form Agenda */
    .form-agenda {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 760px) {
      .form-agenda {
        grid-template-columns: 1fr;
      }
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="file"],
    input[type="url"],
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #ccd2dc;
      border-radius: 6px;
      background: #fff;
      font-size: 0.95rem;
    }

    button {
      background-color: #1d63ed;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }

    button:hover:not(:disabled) {
      background-color: #154ec0;
    }

    button:disabled {
      background-color: #a9bce6;
      cursor: not-allowed;
    }

    button.btn-secondario {
      background-color: #eef2f7;
      color: #222;
      border: 1px solid #cfd6e0;
    }

    button.btn-secondario:hover:not(:disabled) {
      background-color: #e2e8f0;
    }

    button.btn-secondario.attivo {
      background-color: #1d63ed;
      color: #fff;
      border-color: #1d63ed;
    }

    button.btn-pericolo {
      background-color: #d92d20;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    button.btn-pericolo:hover {
      background-color: #b42318;
    }

    button.btn-piccolo {
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    /* Barra filtri */
    .barra-filtri {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      background: #fafbfd;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e0e4ea;
    }

    .bottoni-filtro {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .data-riferimento {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .data-riferimento input[type="date"] {
      width: auto;
    }

    /* Lista promemoria */
    .lista-promemoria {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-promemoria {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      background: #fafbfd;
    }

    .item-promemoria.completato .titolo-promemoria {
      text-decoration: line-through;
      color: #6c757d;
    }

    .info-promemoria {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
    }

    .meta-promemoria {
      font-size: 0.85rem;
      color: #555;
    }

    .azioni-promemoria {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Sezione Stampa Foto e PDF */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      padding: 16px;
      background: #fafbfd;
    }

    .card input[type="file"],
    .card input[type="url"] {
      margin: 10px 0 12px;
    }

    .card button {
      width: 100%;
    }

    .preview-box {
      border: 1px dashed #cbd2d9;
      border-radius: 8px;
      padding: 16px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      overflow: hidden;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      display: none;
    }

    .preview-box iframe {
      width: 100%;
      height: 500px;
      border: none;
      display: none;
    }

    .placeholder {
      color: #6c757d;
      text-align: center;
    }

    .messaggio {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #b42318;
      min-height: 20px;
    }

    /* Stili dedicati alla stampa */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      .container > h1,
      .sezione-agenda,
      .grid,
      .messaggio,
      .placeholder {
        display: none !important;
      }

      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }

      .sezione-stampa {
        margin: 0;
        padding: 0;
        border: none;
      }

      .sezione-stampa > h2 {
        display: none;
      }

      .preview-box {
        border: none;
        padding: 0;
        min-height: auto;
      }

      .preview-box img {
        max-width: 100%;
        max-height: 100vh;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agenda Promemoria & Stampa Foto / PDF</h1>

    <!-- SEZIONE 1: AGENDA E FILTRO PROMEMORIA -->
    <section class="sezione sezione-agenda">
      <h2>Nuovo Promemoria</h2>
      <form class="form-agenda" id="formPromemoria">
        <input type="text" id="inputTitolo" placeholder="Descrizione o titolo promemoria..." required>
        <input type="date" id="inputData" required>
        <input type="time" id="inputOra">
        <button type="submit">Aggiungi</button>
      </form>

      <div class="barra-filtri">
        <div class="bottoni-filtro" role="group" aria-label="Filtro promemoria">
          <button type="button" class="btn-secondario attivo" data-filtro="giornaliero">Giornaliero</button>
          <button type="button" class="btn-secondario" data-filtro="settimanale">Settimanale</button>
          <button type="button" class="btn-secondario" data-filtro="mensile">Mensile</button>
          <button type="button" class="btn-secondario" data-filtro="tutti">Tutti</button>
        </div>

        <div class="data-riferimento">
          <label for="inputDataRiferimento">Data riferimento:</label>
          <input type="date" id="inputDataRiferimento">
        </div>
      </div>

      <ul class="lista-promemoria" id="listaPromemoria"></ul>
    </section>

    <!-- SEZIONE 2: STAMPA FOTO E PDF -->
    <section class="sezione sezione-stampa">
      <h2>Stampa Foto e PDF</h2>

      <div class="grid">
        <!-- 1. Foto da file locale -->
        <div class="card">
          <h2>1. Foto dal dispositivo</h2>
          <input type="file" id="inputFoto" accept="image/*">
          <button id="btnStampaFoto" disabled>Stampa Foto</button>
        </div>

        <!-- 2. PDF da file locale -->
        <div class="card">
          <h2>2. PDF dal dispositivo</h2>
          <input type="file" id="inputPdf" accept="application/pdf">
          <button id="btnStampaPdfLocale" disabled>Stampa PDF</button>
        </div>

        <!-- 3. File tramite URL -->
        <div class="card">
          <h2>3. Foto o PDF da URL</h2>
          <input type="url" id="inputUrl" placeholder="https://esempio.it/file.pdf">
          <button id="btnStampaUrl">Carica e Stampa URL</button>
        </div>
      </div>

      <div class="preview-box" id="previewBox">
        <div class="placeholder" id="placeholder">
          Seleziona una foto, un PDF o inserisci un URL per visualizzare l'anteprima e stampare.
        </div>
        <img id="anteprimaFoto" alt="Anteprima foto">
        <iframe id="anteprimaPdf" title="Anteprima PDF"></iframe>
      </div>

      <div class="messaggio" id="messaggio"></div>
    </section>
  </div>

  <script>
    // --- GESTIONE AGENDA E FILTRO PROMEMORIA ---
    const STORAGE_KEY = 'agenda_promemoria_v1';
    const formPromemoria = document.getElementById('formPromemoria');
    const inputTitolo = document.getElementById('inputTitolo');
    const inputData = document.getElementById('inputData');
    const inputOra = document.getElementById('inputOra');
    const inputDataRiferimento = document.getElementById('inputDataRiferimento');
    const listaPromemoria = document.getElementById('listaPromemoria');
    const bottoniFiltro = document.querySelectorAll('.bottoni-filtro button');

    let promemoria = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let filtroAttivo = 'giornaliero';

    function oggiISO() {
      const now = new Date();
      const anno = now.getFullYear();
      const mese = String(now.getMonth() + 1).padStart(2, '0');
      const giorno = String(now.getDate()).padStart(2, '0');
      return `${anno}-${mese}-${giorno}`;
    }

    inputData.value = oggiISO();
    inputDataRiferimento.value = oggiISO();

    function salvaPromemoria() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(promemoria));
    }

    function filtraPromemoria(lista, filtro, dataRiferimentoStr) {
      const [annoRif, meseRif, giornoRif] = dataRiferimentoStr.split('-').map(Number);
      const rif = new Date(annoRif, meseRif - 1, giornoRif);
      rif.setHours(0, 0, 0, 0);

      // Lunedì - Domenica
      const giornoSettimana = (rif.getDay() + 6) % 7;
      const inizioSettimana = new Date(rif);
      inizioSettimana.setDate(rif.getDate() - giornoSettimana);
      inizioSettimana.setHours(0, 0, 0, 0);

      const fineSettimana = new Date(inizioSettimana);
      fineSettimana.setDate(inizioSettimana.getDate() + 6);
      fineSettimana.setHours(23, 59, 59, 999);

      return lista.filter((item) => {
        if (filtro === 'tutti') return true;

        const [a, m, g] = item.data.split('-').map(Number);
        const d = new Date(a, m - 1, g);
        d.setHours(0, 0, 0, 0);

        if (filtro === 'giornaliero') {
          return d.getTime() === rif.getTime();
        }
        if (filtro === 'settimanale') {
          return d >= inizioSettimana && d <= fineSettimana;
        }
        if (filtro === 'mensile') {
          return d.getFullYear() === rif.getFullYear() && d.getMonth() === rif.getMonth();
        }
        return true;
      });
    }

    function renderPromemoria() {
      const dataRif = inputDataRiferimento.value || oggiISO();
      const filtrati = filtraPromemoria(promemoria, filtroAttivo, dataRif)
        .sort((a, b) => `${a.data} ${a.ora || ''}`.localeCompare(`${b.data} ${b.ora || ''}`));

      listaPromemoria.innerHTML = '';

      if (filtrati.length === 0) {
        const vuoto = document.createElement('li');
        vuoto.className = 'placeholder';
        vuoto.style.padding = '16px';
        vuoto.textContent = `Nessun promemoria per il filtro "${filtroAttivo}".`;
        listaPromemoria.appendChild(vuoto);
        return;
      }

      filtrati.forEach((item) => {
        const li = document.createElement('li');
        li.className = `item-promemoria ${item.completato ? 'completato' : ''}`;

        const info = document.createElement('div');
        info.className = 'info-promemoria';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(item.completato);
        checkbox.addEventListener('change', () => {
          item.completato = checkbox.checked;
          salvaPromemoria();
          renderPromemoria();
        });

        const testoBox = document.createElement('div');
        const titolo = document.createElement('div');
        titolo.className = 'titolo-promemoria';
        titolo.textContent = item.titolo;

        const meta = document.createElement('div');
        meta.className = 'meta-promemoria';
        meta.textContent = `Data: ${item.data}${item.ora ? ` • Ora: ${item.ora}` : ''}`;

        testoBox.appendChild(titolo);
        testoBox.appendChild(meta);

        info.appendChild(checkbox);
        info.appendChild(testoBox);

        const azioni = document.createElement('div');
        azioni.className = 'azioni-promemoria';

        const btnUsaUrl = document.createElement('button');
        btnUsaUrl.type = 'button';
        btnUsaUrl.className = 'btn-secondario btn-piccolo';
        btnUsaUrl.textContent = 'Stampa URL';
        btnUsaUrl.addEventListener('click', () => {
          inputUrl.value = prompt('Inserisci URL di foto o PDF da stampare:', '') || '';
          if (inputUrl.value.trim()) {
            btnStampaUrl.click();
          }
        });

        const btnElimina = document.createElement('button');
        btnElimina.type = 'button';
        btnElimina.className = 'btn-pericolo';
        btnElimina.textContent = 'Elimina';
        btnElimina.addEventListener('click', () => {
          promemoria = promemoria.filter((p) => p.id !== item.id);
          salvaPromemoria();
          renderPromemoria();
        });

        azioni.appendChild(btnUsaUrl);
        azioni.appendChild(btnElimina);

        li.appendChild(info);
        li.appendChild(azioni);
        listaPromemoria.appendChild(li);
      });
    }

    formPromemoria.addEventListener('submit', (e) => {
      e.preventDefault();
      const titolo = inputTitolo.value.trim();
      const data = inputData.value;
      const ora = inputOra.value;

      if (!titolo || !data) return;

      promemoria.push({
        id: Date.now().toString(),
        titolo,
        data,
        ora,
        completato: false
      });

      salvaPromemoria();
      inputTitolo.value = '';
      renderPromemoria();
    });

    bottoniFiltro.forEach((btn) => {
      btn.addEventListener('click', () => {
        bottoniFiltro.forEach((b) => b.classList.remove('attivo'));
        btn.classList.add('attivo');
        filtroAttivo = btn.dataset.filtro;
        renderPromemoria();
      });
    });

    inputDataRiferimento.addEventListener('change', renderPromemoria);

    // --- GESTIONE STAMPA FOTO E PDF ---
    const inputFoto = document.getElementById('inputFoto');
    const inputPdf = document.getElementById('inputPdf');
    const inputUrl = document.getElementById('inputUrl');

    const btnStampaFoto = document.getElementById('btnStampaFoto');
    const btnStampaPdfLocale = document.getElementById('btnStampaPdfLocale');
    const btnStampaUrl = document.getElementById('btnStampaUrl');

    const anteprimaFoto = document.getElementById('anteprimaFoto');
    const anteprimaPdf = document.getElementById('anteprimaPdf');
    const placeholder = document.getElementById('placeholder');
    const messaggio = document.getElementById('messaggio');

    let urlOggettoCorrente = null;
    let urlPdfCorrente = null;

    function mostraMessaggio(testo) {
      messaggio.textContent = testo;
    }

    function resetAnteprima() {
      mostraMessaggio('');
      placeholder.style.display = 'none';
      anteprimaFoto.style.display = 'none';
      anteprimaPdf.style.display = 'none';
      btnStampaFoto.disabled = true;
      btnStampaPdfLocale.disabled = true;

      if (urlOggettoCorrente) {
        URL.revokeObjectURL(urlOggettoCorrente);
        urlOggettoCorrente = null;
      }
    }

    inputFoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetAnteprima();
      urlOggettoCorrente = URL.createObjectURL(file);
      anteprimaFoto.src = urlOggettoCorrente;
      anteprimaFoto.style.display = 'block';
      btnStampaFoto.disabled = false;
      inputPdf.value = '';
    });

    btnStampaFoto.addEventListener('click', () => {
      if (!anteprimaFoto.src) return;

      const finestra = window.open('', '_blank', 'width=800,height=600');
      if (!finestra) {
        mostraMessaggio('Consenti i popup nel browser per avviare la stampa.');
        return;
      }

      finestra.document.write(`
        <!DOCTYPE html>
        <html lang="it">
        <head>
          <meta charset="UTF-8">
          <title>Stampa Foto</title>
          <style>
            @page { margin: 10mm; }
            body {
              margin: 0;
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
            }
            img {
              max-width: 100%;
              max-height: 95vh;
              object-fit: contain;
            }
          </style>
        </head>
        <body>
          <img id="imgStampa" src="${anteprimaFoto.src}" alt="Foto da stampare">
          <script>
            const img = document.getElementById('imgStampa');
            img.onload = () => {
              window.focus();
              window.print();
              window.close();
            };
          <\/script>
        </body>
        </html>
      `);
      finestra.document.close();
    });

    inputPdf.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      resetAnteprima();
      urlOggettoCorrente = URL.createObjectURL(file);
      urlPdfCorrente = urlOggettoCorrente;
      anteprimaPdf.src = urlOggettoCorrente;
      anteprimaPdf.style.display = 'block';
      btnStampaPdfLocale.disabled = false;
      inputFoto.value = '';
    });

    btnStampaPdfLocale.addEventListener('click', () => {
      if (!urlPdfCorrente) return;
      stampaPdfDaUrl(urlPdfCorrente);
    });

    btnStampaUrl.addEventListener('click', () => {
      const url = inputUrl.value.trim();
      if (!url) {
        mostraMessaggio('Inserisci un URL valido.');
        return;
      }

      resetAnteprima();
      const ePdf = url.toLowerCase().includes('.pdf');

      if (ePdf) {
        urlPdfCorrente = url;
        anteprimaPdf.src = url;
        anteprimaPdf.style.display = 'block';
        stampaPdfDaUrl(url);
      } else {
        anteprimaFoto.onload = () => {
          btnStampaFoto.disabled = false;
          btnStampaFoto.click();
        };
        anteprimaFoto.onerror = () => {
          placeholder.style.display = 'block';
          mostraMessaggio('Impossibile caricare la foto dall’URL indicato.');
        };
        anteprimaFoto.src = url;
        anteprimaFoto.style.display = 'block';
      }
    });

    function stampaPdfDaUrl(url) {
      const iframeStampa = document.createElement('iframe');
      iframeStampa.style.position = 'fixed';
      iframeStampa.style.right = '0';
      iframeStampa.style.bottom = '0';
      iframeStampa.style.width = '0';
      iframeStampa.style.height = '0';
      iframeStampa.style.border = '0';
      iframeStampa.src = url;

      iframeStampa.onload = () => {
        try {
          iframeStampa.contentWindow.focus();
          iframeStampa.contentWindow.print();
        } catch (err) {
          window.open(url, '_blank');
        }
      };

      document.body.appendChild(iframeStampa);
    }

    // Avvio iniziale
    renderPromemoria();
  </script>
</body>
</html>
